<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>司雅博 - 幻灯片</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #2c3e50;
            font-family: "Microsoft YaHei", sans-serif;
        }
        .slider {
            width: 480px;            height: 340px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            position: relative;
        }
        .slider-img img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            animation: slideFade 6s infinite;
        }
        .slider-img img:nth-child(2) {
            animation-delay: 3s;
        }
        @keyframes slideFade {
            0%   { opacity: 0; }
            20%  { opacity: 1; }
            50%  { opacity: 1; }
            70%  { opacity: 0; }
            100% { opacity: 0; }
        }
        .slider-text {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 10px 0;
            background-color: rgba(0, 0, 0, 0.55);
            color: #fff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 2;
        }
        .slider-text .name {
            font-size: 26px;
            letter-spacing: 8px;
            font-weight: bold;
        }
        .slider-text .sid {
            font-size: 14px;
            letter-spacing: 2px;
            margin-top: 4px;
            opacity: 0.85;
        }
    </style>
</head>
<body>
    <div class="slider">
        <div class="slider-img">
            <img src="./img/1.jpg" alt="图片1">
            <img src="./img/3.jpg" alt="图片3">
        </div>
        <div class="slider-text">
            <span class="name">司雅博爱刘诗伽</span>
            <span class="sid">24001011026 · 基于css animation的幻灯片</span>
        </div>
    </div>
</body>
</html>
