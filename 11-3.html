<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>司雅博 - CSS3 3D动画</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            font-family: "Microsoft YaHei", sans-serif;
            background-color: #1a1a2e;
            padding: 40px 20px;
            overflow-x: hidden;
        }
        .si_header {
            text-align: center;
            padding: 20px 0 30px;
            color: #fff;
        }
        .si_header h1 { font-size: 28px; margin-bottom: 8px; }
        .si_header p { font-size: 14px; color: #aaa; }
        .si_container {
            max-width: 1000px;
            margin: 0 auto;
        }
        .si_card {
            background: #16213e;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            border: 1px solid #0f3460;
        }
        .si_card h2 {
            font-size: 20px;
            color: #e94560;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #e94560;
            display: inline-block;
        }
        .si_perspective {
            perspective: 800px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 200px;
        }
        .si_cube {
            width: 100px;
            height: 100px;
            position: relative;
            transform-style: preserve-3d;
            animation: si_rotateCube 4s infinite linear;
        }
        .si_face {
            position: absolute;
            width: 100px;
            height: 100px;
            border: 2px solid #e94560;
            background: rgba(233, 69, 96, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: #fff;
            font-weight: bold;
        }
        .si_front  { transform: rotateY(0deg) translateZ(50px); }
        .si_back   { transform: rotateY(180deg) translateZ(50px); }
        .si_right  { transform: rotateY(90deg) translateZ(50px); }
        .si_left   { transform: rotateY(-90deg) translateZ(50px); }
        .si_top    { transform: rotateX(90deg) translateZ(50px); }
        .si_bottom { transform: rotateX(-90deg) translateZ(50px); }
        @keyframes si_rotateCube {
            from { transform: rotateX(0deg) rotateY(0deg); }
            to   { transform: rotateX(360deg) rotateY(360deg); }
        }
        .si_flipCard {
            width: 200px;
            height: 280px;
            perspective: 800px;
            margin: 0 auto;
        }
        .si_flipInner {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.8s;
        }
        .si_flipCard:hover .si_flipInner {
            transform: rotateY(180deg);
        }
        .si_flipFront, .si_flipBack {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            color: #fff;
            font-size: 16px;
        }
        .si_flipFront {
            background: linear-gradient(135deg, #667eea, #764ba2);
        }
        .si_flipBack {
            background: linear-gradient(135deg, #e94560, #c23152);
            transform: rotateY(180deg);
        }
        .si_row {
            display: flex;
            justify-content: center;
            gap: 40px;
            flex-wrap: wrap;
        }
        .si_demo3d {
            width: 120px;
            height: 120px;
            background: linear-gradient(135deg, #00b4db, #0083b0);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 14px;
            font-weight: bold;
            animation: si_float3d 3s ease-in-out infinite;
            transform-style: preserve-3d;
        }
        @keyframes si_float3d {
            0%, 100% { transform: rotateX(0deg) rotateY(0deg) translateZ(0px); }
            25%      { transform: rotateX(15deg) rotateY(15deg) translateZ(20px); }
            50%      { transform: rotateX(0deg) rotateY(180deg) translateZ(0px); }
            75%      { transform: rotateX(-15deg) rotateY(195deg) translateZ(20px); }
        }
    </style>
</head>
<body>
    <div class="si_header">
        <h1>司雅博 24001011026</h1>
        <p>CSS3 3D 动画演示</p>
    </div>
    <div class="si_container">
        <div class="si_card">
            <h2>3D 旋转立方体</h2>
            <div class="si_perspective">
                <div class="si_cube">
                    <div class="si_face si_front">前</div>
                    <div class="si_face si_back">后</div>
                    <div class="si_face si_right">右</div>
                    <div class="si_face si_left">左</div>
                    <div class="si_face si_top">上</div>
                    <div class="si_face si_bottom">下</div>
                </div>
            </div>
        </div>
        <div class="si_card">
            <h2>3D 翻转卡片（悬停查看）</h2>
            <div class="si_flipCard">
                <div class="si_flipInner">
                    <div class="si_flipFront">正面</div>
                    <div class="si_flipBack">背面</div>
                </div>
            </div>
        </div>
        <div class="si_card">
            <h2>3D 浮动动画</h2>
            <div class="si_row">
                <div class="si_demo3d">3D 浮动</div>
                <div class="si_demo3d" style="animation-delay: 0.5s;">3D 浮动</div>
                <div class="si_demo3d" style="animation-delay: 1s;">3D 浮动</div>
            </div>
        </div>
    </div>
</body>
</html>
