<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>移动端底部导航 - SVG 图标方式</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body {
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #f5f6fa;
            color: #2c3e50;
        }
        .icon {
            width: 1em;
            height: 1em;
            vertical-align: -0.15em;
            fill: currentColor;
            overflow: hidden;
        }

        .status-bar {
            height: 44px;
            background: linear-gradient(135deg, #f7971e 0%, #ffd200 100%);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            color: #fff;
            font-size: 12px;
            font-weight: 600;
        }
        .status-bar .time { font-size: 15px; }
        .status-bar .signal { letter-spacing: 2px; }

        .header {
            background: linear-gradient(135deg, #f7971e 0%, #ffd200 100%);
            padding: 4px 20px 48px;
            color: #fff;
        }
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        .header-top h1 {
            font-size: 22px;
            font-weight: 700;
        }
        .header-top .header-icon {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: rgba(255,255,255,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .header-top .header-icon svg { width: 22px; height: 22px; color: #fff; }

        .container {
            padding: 0 16px;
            padding-bottom: 100px;
        }

        .search-box {
            background: #fff;
            border-radius: 24px;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 16px rgba(247,151,30,0.15);
            margin-bottom: 16px;
        }
        .search-box svg { width: 18px; height: 18px; color: #f7971e; flex-shrink: 0; }
        .search-box input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 14px;
            background: transparent;
            color: #2c3e50;
        }
        .search-box input::placeholder { color: #b2bec3; }

        .banner {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            border-radius: 16px;
            padding: 22px 20px;
            color: #fff;
            margin-bottom: 16px;
            position: relative;
            overflow: hidden;
        }
        .banner::after {
            content: '';
            position: absolute;
            right: -30px;
            top: -30px;
            width: 120px;
            height: 120px;
            background: rgba(255,255,255,0.15);
            border-radius: 50%;
        }
        .banner h2 { font-size: 18px; margin-bottom: 6px; font-weight: 700; }
        .banner p { font-size: 12px; opacity: 0.9; }

        .quick-nav {
            background: #fff;
            border-radius: 14px;
            padding: 18px 8px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.04);
            margin-bottom: 16px;
        }
        .quick-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            padding: 6px 0;
        }
        .quick-icon {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .quick-icon svg { width: 24px; height: 24px; }
        .quick-icon.q1 { background: linear-gradient(135deg, #ffecd2, #fcb69f); }
        .quick-icon.q1 svg { color: #e17055; }
        .quick-icon.q2 { background: linear-gradient(135deg, #a1c4fd, #c2e9fb); }
        .quick-icon.q2 svg { color: #0984e3; }
        .quick-icon.q3 { background: linear-gradient(135deg, #f6d365, #fda085); }
        .quick-icon.q3 svg { color: #d63031; }
        .quick-icon.q4 { background: linear-gradient(135deg, #d4fc79, #96e6a1); }
        .quick-icon.q4 svg { color: #00b894; }
        .quick-label { font-size: 12px; color: #636e72; }

        .section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 20px 4px 12px;
        }
        .section h3 { font-size: 15px; font-weight: 600; color: #2c3e50; }
        .section .more { font-size: 12px; color: #b2bec3; }

        .news-list {
            background: #fff;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 2px 12px rgba(0,0,0,0.04);
        }
        .news-item {
            display: flex;
            align-items: center;
            padding: 14px 16px;
            gap: 14px;
            border-bottom: 1px solid #f1f2f6;
            cursor: pointer;
        }
        .news-item:last-child { border-bottom: none; }
        .news-thumb {
            width: 56px;
            height: 56px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .news-thumb svg { width: 28px; height: 28px; }
        .news-thumb.t1 { background: linear-gradient(135deg, #ff9a9e, #fad0c4); }
        .news-thumb.t1 svg { color: #e84393; }
        .news-thumb.t2 { background: linear-gradient(135deg, #a1c4fd, #c2e9fb); }
        .news-thumb.t2 svg { color: #0984e3; }
        .news-thumb.t3 { background: linear-gradient(135deg, #fbc2eb, #a6c1ee); }
        .news-thumb.t3 svg { color: #6c5ce7; }
        .news-info { flex: 1; min-width: 0; }
        .news-title { font-size: 14px; color: #2c3e50; margin-bottom: 5px; font-weight: 500; }
        .news-desc { font-size: 12px; color: #b2bec3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .news-meta {
            font-size: 11px;
            color: #b2bec3;
            margin-top: 6px;
            display: flex;
            gap: 10px;
        }
        .news-tag {
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 10px;
            background: linear-gradient(135deg, #f7971e, #ffd200);
            color: #fff;
            font-weight: 600;
        }

        .tabbar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background: #ffffff;
            display: flex;
            box-shadow: 0 -1px 8px rgba(0,0,0,0.08);
            border-top: 1px solid #f1f2f6;
            z-index: 999;
            padding-bottom: env(safe-area-inset-bottom);
        }
        .tab-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            cursor: pointer;
            text-decoration: none;
            gap: 3px;
        }
        .tab-item svg {
            width: 26px;
            height: 26px;
            color: #b2bec3;
            transition: color 0.25s ease, transform 0.25s ease;
        }
        .tab-item .tab-label {
            font-size: 11px;
            color: #b2bec3;
            transition: color 0.25s ease;
        }
        .tab-item.active svg {
            color: #f7971e;
            transform: translateY(-2px);
        }
        .tab-item.active .tab-label {
            color: #f7971e;
            font-weight: 600;
        }
        .tab-item:active svg {
            transform: scale(0.85);
        }

        .badge {
            position: absolute;
            top: 3px;
            right: calc(50% - 28px);
            min-width: 16px;
            height: 16px;
            padding: 0 5px;
            background: #d63031;
            color: #fff;
            font-size: 10px;
            font-weight: 600;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
            box-shadow: 0 0 0 2px #fff;
            transform-origin: center;
            transition: transform 0.25s ease;
        }
        .badge.badge-dot {
            min-width: 8px;
            width: 8px;
            height: 8px;
            padding: 0;
            border-radius: 50%;
            top: 7px;
            right: calc(50% - 20px);
        }
        .badge.hide { transform: scale(0); }

        .indicator-bar {
            position: absolute;
            top: 0;
            width: 22px;
            height: 3px;
            background: linear-gradient(90deg, #f7971e, #ffd200);
            border-radius: 0 0 3px 3px;
            transition: left 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="status-bar">
        <span class="time">9:41</span>
        <span class="signal">●●●●● ● 🔋</span>
    </div>

    <div class="header">
        <div class="header-top">
            <h1>生活服务</h1>
            <div class="header-icon">
                <svg class="icon" aria-hidden="true"><use xlink:href="#icon-wangluo"></use></svg>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="search-box">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="8"/>
                <path d="m21 21-4.3-4.3"/>
            </svg>
            <input type="text" placeholder="搜索应用、小程序、活动...">
        </div>

        <div class="banner">
            <h2>新人专享 · 限量礼包</h2>
            <p>注册即送 100 金币，限时领取中</p>
        </div>

        <div class="quick-nav">
            <div class="quick-item">
                <div class="quick-icon q1">
                    <svg class="icon" aria-hidden="true"><use xlink:href="#icon-yingyong"></use></svg>
                </div>
                <span class="quick-label">应用</span>
            </div>
            <div class="quick-item">
                <div class="quick-icon q2">
                    <svg class="icon" aria-hidden="true"><use xlink:href="#icon-wangluo"></use></svg>
                </div>
                <span class="quick-label">网络</span>
            </div>
            <div class="quick-item">
                <div class="quick-icon q3">
                    <svg class="icon" aria-hidden="true"><use xlink:href="#icon-jinbi_o"></use></svg>
                </div>
                <span class="quick-label">金币</span>
            </div>
            <div class="quick-item">
                <div class="quick-icon q4">
                    <svg class="icon" aria-hidden="true"><use xlink:href="#icon-xiaochengxu"></use></svg>
                </div>
                <span class="quick-label">小程序</span>
            </div>
        </div>

        <div class="section">
            <h3>热门推荐</h3>
            <span class="more">更多 ›</span>
        </div>

        <div class="news-list">
            <div class="news-item">
                <div class="news-thumb t1">
                    <svg class="icon" aria-hidden="true"><use xlink:href="#icon-jinbi_o"></use></svg>
                </div>
                <div class="news-info">
                    <div class="news-title">每日签到领金币</div>
                    <div class="news-desc">连续签到 7 天，奖励翻倍</div>
                    <div class="news-meta"><span>🔥 热门</span><span>2小时前</span></div>
                </div>
                <span class="news-tag">GO</span>
            </div>
            <div class="news-item">
                <div class="news-thumb t2">
                    <svg class="icon" aria-hidden="true"><use xlink:href="#icon-wangluo"></use></svg>
                </div>
                <div class="news-info">
                    <div class="news-title">5G 网络全覆盖 · 免费体验</div>
                    <div class="news-desc">全城 100+ 热点已开放，一键连接</div>
                    <div class="news-meta"><span>📶 网络</span><span>今日</span></div>
                </div>
            </div>
            <div class="news-item">
                <div class="news-thumb t3">
                    <svg class="icon" aria-hidden="true"><use xlink:href="#icon-xiaochengxu"></use></svg>
                </div>
                <div class="news-info">
                    <div class="news-title">精选小程序合集</div>
                    <div class="news-desc">涵盖工具、游戏、生活三大类</div>
                    <div class="news-meta"><span>✨ NEW</span><span>昨天</span></div>
                </div>
            </div>
        </div>
    </div>

    <nav class="tabbar" id="tabbar">
        <span class="indicator-bar" id="indicator"></span>
        <a class="tab-item active" href="javascript:;" data-tab="app">
            <svg class="icon" aria-hidden="true"><use xlink:href="#icon-yingyong"></use></svg>
            <span class="tab-label">应用</span>
        </a>
        <a class="tab-item" href="javascript:;" data-tab="network">
            <svg class="icon" aria-hidden="true"><use xlink:href="#icon-wangluo"></use></svg>
            <span class="tab-label">网络</span>
            <span class="badge badge-dot"></span>
        </a>
        <a class="tab-item" href="javascript:;" data-tab="coin">
            <svg class="icon" aria-hidden="true"><use xlink:href="#icon-jinbi_o"></use></svg>
            <span class="tab-label">金币</span>
            <span class="badge">8</span>
        </a>
        <a class="tab-item" href="javascript:;" data-tab="mini">
            <svg class="icon" aria-hidden="true"><use xlink:href="#icon-xiaochengxu"></use></svg>
            <span class="tab-label">小程序</span>
        </a>
    </nav>

    <script src="font/download/font_5244786_2soxe0r4aqo/iconfont.js"></script>
    <script>
        const tabbar = document.getElementById('tabbar');
        const indicator = document.getElementById('indicator');
        const tabs = document.querySelectorAll('.tab-item');

        function updateIndicator(tab) {
            const tabRect = tab.getBoundingClientRect();
            const barRect = tabbar.getBoundingClientRect();
            indicator.style.left = (tabRect.left - barRect.left + tabRect.width / 2 - 11) + 'px';
        }

        const activeTab = document.querySelector('.tab-item.active');
        setTimeout(() => updateIndicator(activeTab), 50);

        tabs.forEach(tab => {
            tab.addEventListener('click', function() {
                tabs.forEach(t => t.classList.remove('active'));
                this.classList.add('active');
                updateIndicator(this);

                const badges = this.querySelectorAll('.badge');
                badges.forEach(b => {
                    b.classList.add('hide');
                    setTimeout(() => { b.style.display = 'none'; }, 250);
                });
            });
        });

        window.addEventListener('resize', () => {
            const current = document.querySelector('.tab-item.active');
            if (current) updateIndicator(current);
        });
    </script>
</body>
</html>
