<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>司雅博的JavaScript —— 100个盒子的数7游戏</title>
    <style>
        /* 类名全部以 syb_ 开头（项目规则） */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "Microsoft YaHei", Arial, sans-serif;
            background: #f5f6f8;
            color: #333;
            padding: 40px 24px;
        }
        .syb_header { text-align: center; margin-bottom: 24px; }
        .syb_header h1 { font-size: 26px; color: #2c3e50; }
        .syb_header p { margin-top: 10px; font-size: 14px; color: #7f8c8d; }
        .syb_grid {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 8px;
            max-width: 1020px;
            margin: 0 auto;
        }
        .syb_box {
            background: #fff;
            border-radius: 8px;
            border-top: 3px solid #3498db;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
            color: #2c3e50;
        }
        /* 满足数7规则的盒子：空盒子（黄色底提示位置） */
        .syb_box_pass {
            background: #fff4d6;
            border-top: 3px solid #f39c12;
        }
        .syb_summary {
            max-width: 1020px;
            margin: 20px auto 0;
            text-align: center;
            font-size: 14px;
            color: #7d6608;
            background: #fff9e6;
            border-left: 4px solid #f39c12;
            border-radius: 6px;
            padding: 12px 18px;
            line-height: 1.8;
        }
        @media (max-width: 800px) {
            .syb_box { height: 38px; font-size: 13px; border-radius: 5px; }
        }
    </style>
</head>
<body>
    <div class="syb_header">
        <h1>司雅博的JavaScript —— 100个盒子的数7游戏</h1>
        <p>规则：7的倍数、个位是7、十位是7的数要"过"（显示空盒子），其余显示数字</p>
    </div>

    <!-- 100个盒子由 JavaScript 动态生成 -->
    <div class="syb_grid" id="syb_grid"></div>

    <div class="syb_summary" id="syb_summary"></div>

    <script>
        //数7规则判断函数：7的倍数 或 数字中含有7（个位、十位）
        function syb_isPass(syb_num) {
            if (syb_num % 7 === 0) {                    //7的倍数
                return true;
            }
            if (syb_num % 10 === 7) {                   //个位是7
                return true;
            }
            if (Math.floor(syb_num / 10) === 7) {       //十位是7（70~79）
                return true;
            }
            return false;
        }

        //循环1~100，生成盒子
        var syb_html = "";
        var syb_passCount = 0;      //空盒子的数量
        for (var syb_i = 1; syb_i <= 100; syb_i++) {
            if (syb_isPass(syb_i)) {
                syb_passCount++;
                syb_html += '<div class="syb_box syb_box_pass"></div>';     //满足规则：空盒子
            } else {
                syb_html += '<div class="syb_box">' + syb_i + '</div>';     //不满足规则：显示数字
            }
        }
        document.getElementById("syb_grid").innerHTML = syb_html;

        //统计结果
        document.getElementById("syb_summary").innerHTML =
            "1 ~ 100 中共有 <strong>" + syb_passCount + "</strong> 个数满足数7规则（黄色空盒子），其余 " + (100 - syb_passCount) + " 个数正常显示。";
    </script>
</body>
</html>
