<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>24001011026司雅博</title>
</head>
<body>
    <h2>HTML表单from</h2>
    <from action="http://huanqiu.com" name="syb">
        <p>
            用户名：<input type="text" name="username">
        </p>
        <p>
            密码：<input type="password" name="password">
        </p>
        <p>
            性别：<input type="radio" name="sex" value="m">男
            <input type="radio" name="sex" value="f">女
            <input type="radio" name="sex" value="s">保密
        </p>
        <p>
            爱好：<input type="checkbox" name="hobby" value="1">篮球
            <input type="checkbox" name="hobby" value="2">足球
            <input type="checkbox" name="hobby" value="3">羽毛球
        </p>
        <p>
            籍贯：<select name="jiguan">
                <option value="1">北京</option>
                <option value="2" selected>上海</option>
                <option value="3">天津</option>
                <option value="4">河北</option>
            </select>

        </p>
        <p>
            个人简介：<textarea name="jianjie" cols="30" rows="5"></textarea>
        </p>
        <!-- 出生日期 -->
         <p>
            出生日期：<input type="date" name="birthday">
         </p>
         <p>
            多文件上传：<input type="file" name="files" multiple>
         </p>
         <p>
            <input type="button" name="普通按钮">
            <input type="submit" name="提交按钮">
            <input type="reset" name="重置按钮">
         </p>
         <form>
            <button>表单外按钮</button>
         </form>

    </from>
</body>
</html>
